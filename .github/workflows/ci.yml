name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline (Python, project validation and compilation of the sources)
        uses: ./.github/actions/urtc-baseline
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint (undefined names, unused code, exception chaining)
        run: ruff check
      - name: Type check
        run: python -m mypy
      - name: Install Qt runtime libraries for the headless GUI tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run the tests (protocol encoders, safety paths and the Qt Quick deck, headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov --cov-config=.coveragerc --cov-fail-under=65
      - name: Check the Qt Quick deck against a mock board
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python verify_qt_custom_frame.py
          python verify_qt_telemetry_watch.py
          python verify_qt_utility_panels.py
          python verify_qt_selftest.py
