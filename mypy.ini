# Type check of the program (python -m mypy): the window code, the program and the copies of the shared code. The PySide6 stubs
# reject some uses of a Qt property, so a few kinds of finding are off for the window module only.
[mypy]
files = urtc_can, urtc_ui, qt_tester.py, tester_*.py, advanced_protocol.py, urtc_tester.py
ignore_missing_imports = True

# The Qt objects shared with the other programs: checked in URTC-COMMON without Qt installed; with PySide6 present its stubs reject the string type of a list property.
[mypy-urtc_can.help_qt,urtc_can.node_picker_qt,urtc_can.update_qt]
ignore_errors = True

[mypy-qt_tester]
# PySide6 stubs reject the string type of a Property and type the Property object itself where its value is read; the rest of the checks stay on
disable_error_code = arg-type, return-value, attr-defined, operator, call-overload
