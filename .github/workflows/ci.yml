name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Compile Python sources without running versioning build scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "node_modules", "dist", "build", "target", "__pycache__"}
          files = [path for path in Path(".").rglob("*.py") if not any(part in excluded for part in path.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"PYTHON_SYNTAX=PASS files={len(files)}")
          PY
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint (undefined names, unused code, exception chaining)
        run: ruff check
      - name: Type check
        run: python -m mypy
      - name: Install Qt runtime libraries for the headless GUI tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run the tests (protocol encoders, safety paths and the Qt Quick deck, headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov --cov-config=.coveragerc --cov-fail-under=65
      - name: Check the Qt Quick deck against a mock board
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python verify_qt_custom_frame.py
          python verify_qt_telemetry_watch.py
          python verify_qt_utility_panels.py
          python verify_qt_selftest.py
